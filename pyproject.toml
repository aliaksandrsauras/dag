[project]
name = "dag"
description = "Evaluation of a connected directed acyclic graph"
version = "0.0.1"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Aliaksandr Sauras", email = "aliaksandrsauras@gmail.com" },
]
keywords = [
    "dag",
]
dependencies = []

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "UP", # pyupgrade
]

[tool.ruff.lint.isort]
known-local-folder = [
    "dag",
]

[tool.pytest.ini_options]
addopts = "--tb=native"
testpaths = ["tests"]
